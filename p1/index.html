<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        width: 100%;
         background: linear-gradient(
          to right,
          rgb(55, 65, 81),
          rgb(17, 24, 39),
          rgb(0, 0, 0)
        );
      }
      header {
       
        padding: 0px 40px;
        display: flex;
        height: 64px;
        justify-content: center;
        align-items: center;
        justify-content: space-between;
        border-bottom: 10px seashell;
        box-shadow: 0px 0px 10px grey;
      }
      nav {
        display: flex;
        gap: 20px;
      }
      nav a {
        text-decoration: none;
        cursor: pointer;
        font-size: 20px;
      }
      #nav-btn {
      }
      button {
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="logo">
        <h2>PortFolio.</h2>
      </div>
      <nav>
        <a href="#">Home</a>
        <a href="#">Work</a>
        <a href="#">About</a>
        <a href="#">Exprience</a>
      </nav>
      <div id="nav-btn">
        <button>Get Started</button>
      </div>
    </header>
  </body>
</html>
