<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        width: 100%;
        background-color: aliceblue;
      }
      header {
        padding: 0px 40px;
        display: flex;
        height: 64px;
        justify-content: center;
        align-items: center;
        justify-content: space-between;
        border-bottom: 10px seashell;
        box-shadow: 0px 0px 10px grey;
      }
      nav {
        display: flex;
        gap: 20px;
      }
      nav a {
        text-decoration: none;
        cursor: pointer;
        font-size: 20px;
        position: relative;
      }
      nav a:hover::before {
        width: 100%;
        height: 2px;
        background-color: brown;
        /* position: absolute; */
      }

      nav a::before {
        content: "";
        width: 0%;
        height: 2px;
        position: absolute;
        bottom: 0;
        transition: width 0.3s ease-in-out;
      }

      button {
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        position: relative;
        z-index: 1;
        overflow: hidden;

      }
      button:hover {
        color: white;
      }
      button::before {
        content: "";
        height: 0%;
        width: 100%;
        background-color: rgb(0, 26, 255);
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
        transition: height 0.3s ease-in-out;
      }
      button:hover::before {
        height: 100%;
        /* width: 100%; */
        background-color: brown;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="logo">
        <h2>PortFolio.</h2>
      </div>
      <nav>
        <a href="#">Home</a>
        <a href="#">Work</a>
        <a href="#">About</a>
        <a href="#">Exprience</a>
      </nav>
      <div id="nav-btn">
        <button>Get Started</button>
      </div>
    </header>
  </body>
</html>
