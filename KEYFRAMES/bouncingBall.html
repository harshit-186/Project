<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
      }
      body{
        background-color: black;
        display: flex;
        /* flex-direction: column; */
        align-items: center;
        justify-content: center;

      }
      .box{
        height: 250px;
        width: 300px;
        background-color: aliceblue;
        border-radius: 10px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
      }
      .ball{
        height: 80px;
        width: 80px;
        background-color: rgb(232, 138, 16);
        border-radius: 50%;
        /* padding: 20px 0px; */
        /* padding-bottom: 20px; */
        margin-bottom: 5px;

        animation: ball-anime 0.6s ease-in-out infinite;
      }
      @keyframes ball-anime {
        0%,100%{
            transform: translateY(0);
        }
        50%{
            transform: translateY(-200px);
        }
        
      }
      .shadow{
        height: 20px;
        width: 80px;
        background-color: gray;
        border-radius: 50%;
        margin-bottom: 20px;

        animation: shadow-anime 0.6s ease-in infinite;
      }
      @keyframes shadow-anime {
        0%,100%{
            transform: scale(1);
        }
        50%{
            transform: scale(0.5);
        }
        
      }
    </style>
</head>
<body>
    <div class="box">
        <div class="ball"></div>
        <div class="shadow"></div>
    </div>
</body>
</html>
